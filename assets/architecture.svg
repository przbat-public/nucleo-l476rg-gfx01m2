<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .box  { fill:#ffffff; stroke:#1a1a2e; stroke-width:2; }
      .fill { fill:#e8eef7; stroke:#1a1a2e; stroke-width:1.5; }
      .t    { font-size:14px; font-weight:bold; fill:#1a1a2e; text-anchor:middle; }
      .s    { font-size:11px; fill:#555; text-anchor:middle; }
      .arrow{ stroke:#2d6cdf; stroke-width:2; fill:none; marker-end:url(#ah); }
    </style>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#2d6cdf"/>
    </marker>
  </defs>

  <text class="t" x="410" y="28" font-size="18">Firmware architecture — plasma &amp; starfield demo</text>

  <!-- clock -->
  <rect class="box" x="20" y="60" width="150" height="70" rx="6"/>
  <text class="t" x="95" y="85" font-size="12">Clock tree</text>
  <text class="s" x="95" y="103">HSI16 (16 MHz)</text>
  <text class="s" x="95" y="118">&#8594; PLL x10 /2</text>
  <line class="arrow" x1="170" y1="95" x2="240" y2="95"/>

  <!-- core -->
  <rect class="fill" x="245" y="60" width="170" height="70" rx="6"/>
  <text class="t" x="330" y="85" font-size="12">Cortex-M4</text>
  <text class="s" x="330" y="103">80 MHz · no FPU use</text>
  <text class="s" x="330" y="118">integer math + LUTs</text>

  <!-- SPI -->
  <line class="arrow" x1="415" y1="80" x2="490" y2="80"/>
  <rect class="box" x="495" y="60" width="150" height="70" rx="6"/>
  <text class="t" x="570" y="85" font-size="12">SPI1 master</text>
  <text class="s" x="570" y="103">40 MHz · mode 0</text>
  <text class="s" x="570" y="118">8-bit · polled</text>

  <!-- LCD -->
  <line class="arrow" x1="645" y1="80" x2="710" y2="80"/>
  <rect class="box" x="715" y="60" width="95" height="70" rx="6"/>
  <text class="t" x="762" y="85" font-size="12">ST7789</text>
  <text class="s" x="762" y="103">240x320</text>
  <text class="s" x="762" y="118">RGB565</text>

  <!-- effects -->
  <rect class="fill" x="245" y="160" width="170" height="60" rx="6"/>
  <text class="t" x="330" y="183" font-size="12">Effects engine (fx.c)</text>
  <text class="s" x="330" y="200">plasma ~17 fps</text>
  <text class="s" x="330" y="214">starfield ~30 fps</text>
  <line class="arrow" x1="330" y1="160" x2="330" y2="132"/>

  <!-- frame streaming -->
  <line class="arrow" x1="415" y1="190" x2="490" y2="190"/>
  <rect class="box" x="495" y="160" width="150" height="60" rx="6"/>
  <text class="t" x="570" y="183" font-size="12">Frame streaming</text>
  <text class="s" x="570" y="200">begin / push / end</text>
  <text class="s" x="570" y="214">row precomputed</text>
  <line class="arrow" x1="570" y1="160" x2="570" y2="132"/>

  <!-- debug paths -->
  <rect class="box" x="20" y="160" width="150" height="60" rx="6"/>
  <text class="t" x="95" y="183" font-size="12">Debug (SWD)</text>
  <text class="s" x="95" y="200">ST-LINK on-board</text>
  <text class="s" x="95" y="214">OpenOCD + GDB</text>
  <line class="arrow" x1="170" y1="190" x2="240" y2="190"/>

  <rect class="box" x="20" y="250" width="150" height="60" rx="6"/>
  <text class="t" x="95" y="273" font-size="12">USART2 (VCP)</text>
  <text class="s" x="95" y="290">115200 baud logs</text>
  <text class="s" x="95" y="304">same USB cable</text>
  <line class="arrow" x1="170" y1="280" x2="240" y2="280"/>

  <!-- legend -->
  <text class="s" x="410" y="330">Everything is bare-metal C — no HAL, no vendor libraries. ~2.5 KB of code.</text>
</svg>
