<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .box  { fill:#ffffff; stroke:#1a1a2e; stroke-width:2; }
      .chip { fill:#e8eef7; stroke:#1a1a2e; stroke-width:1.5; }
      .title{ font-size:16px; font-weight:bold; fill:#1a1a2e; }
      .sub  { font-size:12px; fill:#555; }
      .pin  { font-size:12px; font-family:Menlo, monospace; fill:#1a1a2e; }
      .wire { stroke:#2d6cdf; stroke-width:2; fill:none; }
      .wlab { font-size:11px; font-family:Menlo, monospace; fill:#2d6cdf; }
      .gnd  { stroke:#777; stroke-width:1.5; fill:none; }
    </style>
  </defs>

  <!-- NUCLEO board -->
  <rect class="box" x="20" y="40" width="280" height="360" rx="8"/>
  <text class="title" x="160" y="70" text-anchor="middle">NUCLEO-L476RG</text>
  <text class="sub" x="160" y="88" text-anchor="middle">STM32L476RG · Cortex-M4 · 80 MHz</text>

  <!-- MCU pins (left side, near the shield) -->
  <g class="pin">
    <text x="260" y="120" text-anchor="end">PA5</text>
    <text x="260" y="150" text-anchor="end">PA6</text>
    <text x="260" y="180" text-anchor="end">PA7</text>
    <text x="260" y="210" text-anchor="end">PA9</text>
    <text x="260" y="240" text-anchor="end">PB10</text>
    <text x="260" y="270" text-anchor="end">PA1</text>
  </g>

  <!-- shield -->
  <rect class="box" x="460" y="40" width="280" height="360" rx="8"/>
  <text class="title" x="600" y="70" text-anchor="middle">X-NUCLEO-GFX01M2</text>
  <text class="sub" x="600" y="88" text-anchor="middle">2.2&quot; SPI display shield (DT022CTFT)</text>

  <rect class="chip" x="500" y="150" width="200" height="200" rx="6"/>
  <text class="title" x="600" y="180" text-anchor="middle" font-size="14">ST7789H2</text>
  <text class="sub" x="600" y="200" text-anchor="middle">LCD controller</text>
  <text class="sub" x="600" y="218" text-anchor="middle">240 x 320 · RGB565</text>
  <rect x="520" y="240" width="160" height="80" rx="4" fill="#f5f0e6" stroke="#999"/>
  <text class="sub" x="600" y="275" text-anchor="middle">TFT panel</text>
  <text class="sub" x="600" y="292" text-anchor="middle">(2.2 inch)</text>

  <!-- shield input pins -->
  <g class="pin">
    <text x="500" y="120" >SCK</text>
    <text x="500" y="150" >MISO</text>
    <text x="500" y="180" >MOSI</text>
    <text x="500" y="210" >CS</text>
    <text x="500" y="240" >DC</text>
    <text x="500" y="270" >RST</text>
  </g>

  <!-- wires -->
  <g class="wire">
    <line x1="300" y1="115" x2="495" y2="115"/>
    <line x1="300" y1="145" x2="495" y2="145"/>
    <line x1="300" y1="175" x2="495" y2="175"/>
    <line x1="300" y1="205" x2="495" y2="205"/>
    <line x1="300" y1="235" x2="495" y2="235"/>
    <line x1="300" y1="265" x2="495" y2="265"/>
  </g>
  <g class="wlab">
    <text x="340" y="111">SPI1_SCK</text>
    <text x="340" y="141">SPI1_MISO</text>
    <text x="340" y="171">SPI1_MOSI</text>
    <text x="340" y="201">chip select</text>
    <text x="340" y="231">data/command</text>
    <text x="340" y="261">reset (low)</text>
  </g>

  <!-- power/ground -->
  <line class="gnd" x1="200" y1="315" x2="560" y2="315"/>
  <text class="sub" x="380" y="335" text-anchor="middle">3V3 + GND (via shield connectors)</text>

  <!-- note -->
  <text class="sub" x="160" y="385" text-anchor="middle">SPI1 @ 40 MHz · mode 0 · 8-bit</text>
  <text class="sub" x="600" y="385" text-anchor="middle">Mount the shield the RIGHT way round!</text>
</svg>
